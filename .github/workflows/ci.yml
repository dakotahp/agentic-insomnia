name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check package.json and plugin.json versions match
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          for MANIFEST in .claude-plugin/plugin.json plugin.json; do
            PLUGIN_VERSION=$(node -p "require('./$MANIFEST').version")
            if [ "$PACKAGE_VERSION" != "$PLUGIN_VERSION" ]; then
              echo "Version mismatch: package.json is $PACKAGE_VERSION, $MANIFEST is $PLUGIN_VERSION"
              exit 1
            fi
          done

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Smoke test CLI entry point
        run: node caffeine.js version
